stages:
  - s360
  - check
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        S360_PURPOSE: baseline
        S360_CHECK_KEY: '$S360_BASELINE_KEY'
    - if: '$CI_COMMIT_BRANCH'

variables:
  S360_PURPOSE: review
  S360_CHECK_KEY: ''
  npm_config_registry: 'https://nopkg.aiursoft.com/npm/'

before_script:
  - export PATH="$HOME/.dotnet/tools:$PATH"
  - command -v dotnet || { echo "Runner is missing dotnet." >&2; exit 1; }
  - dotnet tool update --global Aiursoft.S360.Client --source https://nupkg.aiursoft.com/v3/index.json
  - s360 --version

s360:
  stage: s360
  script:
    - s360 check --path . --ecosystem npm --npm-lockfile-only --npm-registry "$npm_config_registry" --purpose "$S360_PURPOSE"
  retry:
    max: 2
    when: runner_system_failure

check:
  stage: check
  script:
    - npm ci
    - npm run check
    - npm pack
  artifacts:
    expire_in: 1 week
    paths:
      - '*.tgz'

.publish_npm:
  stage: publish
  needs:
    - job: check
      artifacts: true
  resource_group: npm-publish
  script:
    - |
      set -- *.tgz
      test "$#" -eq 1
      test -f "$1"
      package_name=$(node -p 'encodeURIComponent(require("./package.json").name)')
      package_version=$(node -p 'require("./package.json").version')
      status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
        "$PUBLISH_REGISTRY/$package_name/$package_version")
      case "$status" in
        200) echo "Version $package_version is already published; keeping the existing release."; exit 0 ;;
        404) ;;
        *) echo "Cannot check published versions (HTTP $status)." >&2; exit 1 ;;
      esac
      node publish-package.mjs "$1" --target "$PUBLISH_TARGET" --report "publish-results-$PUBLISH_TARGET.json"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - publish-results-*.json

publish_internal:
  extends: .publish_npm
  variables:
    PUBLISH_TARGET: internal
    PUBLISH_REGISTRY: https://nopkg.aiursoft.com/npm
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $NOPKG_TOKEN'

publish_public:
  extends: .publish_npm
  variables:
    PUBLISH_TARGET: public
    PUBLISH_REGISTRY: https://registry.npmjs.org
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
